
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Payment Gateway</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</head>

<body class="bg-light">

    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow border-0">

                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="mb-0">Student Payment Gateway</h3>
                        <p class="mb-0">Enter your details to continue</p>
                    </div>

                    <div class="card-body p-4">

                        <form id="payment-form">

                            <div class="mb-3">
                                <label class="form-label">Student Name</label>
                                <input type="text"
                                       class="form-control"
                                       name="name"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email"
                                       class="form-control"
                                       name="email"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel"
                                       class="form-control"
                                       name="phno"
                                       pattern="[0-9]{10}"
                                       maxlength="10"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Select Course</label>

                                <select class="form-select" name="course" required>
                                    <option value="">Choose a course</option>
                                    <option value="Java">Java Programming</option>
                                    <option value="Python">Python Programming</option>
                                    <option value="Web Development">Web Development</option>
                                    <option value="Spring Boot">Spring Boot</option>
                                    <option value="Data Structures">Data Structures</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Course Amount (₹)</label>

                                <input type="number"
                                       class="form-control"
                                       name="amount"
                                       min="1"
                                       required>
                            </div>

                            <div class="d-grid">
                                <button type="submit"
                                        id="pay-button"
                                        class="btn btn-primary btn-lg">
                                    Proceed to Payment
                                </button>
                            </div>

                        </form>

                    </div>

                    <div class="card-footer text-center text-muted">
                        Secure Student Payment Portal
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        const form = document.getElementById("payment-form");
        const payButton = document.getElementById("pay-button");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            payButton.disabled = true;
            payButton.innerText = "Creating Order...";

            try {

                // Send student details to Spring Boot
                const response = await fetch("/create-order", {
                    method: "POST",
                    body: new URLSearchParams(new FormData(form))
                });

                if (!response.ok) {
                    throw new Error("Unable to create Razorpay order");
                }

                // Receive order details from backend
                const orderData = await response.json();

                // Configure Razorpay Checkout
                const options = {

                    key: orderData.key,

                    amount: orderData.amount,

                    currency: orderData.currency,

                    name: "Student Payment Gateway",

                    description: "Course Payment",

                    order_id: orderData.razorpayOrderId,

                    prefill: {
                        name: orderData.name,
                        email: orderData.email,
                        contact: orderData.contact
                    },

                    theme: {
                        color: "#0d6efd"
                    },

                    handler: function(paymentResponse) {

                        console.log(paymentResponse);

                        alert(
                            "Checkout response received!\n" +
                            "Payment ID: " +
                            paymentResponse.razorpay_payment_id +
                            "\n\nServer-side verification is still required."
                        );

                        payButton.disabled = false;
                        payButton.innerText = "Proceed to Payment";
                    },

                    modal: {
                        ondismiss: function() {
                            payButton.disabled = false;
                            payButton.innerText = "Proceed to Payment";
                        }
                    }

                };

                // Open Razorpay Checkout
                const razorpay = new Razorpay(options);

                razorpay.on("payment.failed", function(response) {

                    alert(
                        "Payment Failed: " +
                        response.error.description
                    );

                    payButton.disabled = false;
                    payButton.innerText = "Proceed to Payment";

                });

                razorpay.open();

            } catch(error) {

                alert(error.message);

                payButton.disabled = false;
                payButton.innerText = "Proceed to Payment";

            }

        });

    </script>

</body>
</html>
